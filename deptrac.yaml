deptrac:
  paths:
    - ./src
  layers:
    - name: Validator
      collectors:
        - type: directory
          value: src/Validator/.*
    - name: Bundle
      collectors:
        - type: directory
          value: src/Bundle/.*
  ruleset:
    # No Doctrine layer exists here at all -- that absence is the split. The
    # bundle may reach the Doctrine package's registrars, but only behind a
    # class_exists guard, and that package is not a declared layer.
    Validator: ~
    Bundle:
      - Validator
