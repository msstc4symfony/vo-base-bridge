variables:
  CORE_REPO: "https://github.com/msstc4php/vo-base.git"
  CORE_BRANCH: "feat/value-objects-library"
  DOCTRINE_REPO: "https://github.com/msstc4php/vo-base-doctrine-bridge.git"
  DOCTRINE_BRANCH: "main"

default:
  image: php:8.4-cli
  before_script:
    - git clone --depth 1 --branch "$CORE_BRANCH" "$CORE_REPO" ../vo-base
    - git clone --depth 1 --branch "$DOCTRINE_BRANCH" "$DOCTRINE_REPO" ../vo-base-doctrine-bridge

stages:
  - check
  - isolation

full:
  stage: check
  script:
    - composer install --no-interaction --no-progress
    - make check
    - make test

# The machine form of KTD3: the Doctrine bridge is suggested, never required.
without-doctrine:
  stage: isolation
  script:
    - composer install --no-interaction --no-progress
    - composer remove --dev --no-interaction --no-progress msstc4php/vo-base-doctrine-bridge doctrine/doctrine-bundle doctrine/mongodb-odm-bundle doctrine/orm doctrine/dbal doctrine/mongodb-odm
    - php tools/check-autoload-isolation.php "$PWD/src" 'MSSTC4PHP\ValueObjectSymfonyBridge\'
    - vendor/bin/phpunit --testsuite=Validator
    - vendor/bin/phpunit --testsuite=Bundle
